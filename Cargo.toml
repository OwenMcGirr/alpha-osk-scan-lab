[package]
name = "alpha-osk-scan-lab"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.61.3", features = [
  "Win32_Foundation", "Win32_UI_Accessibility", "Win32_System_Com",
  "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Security"
] }

[profile.release]
lto = "thin"
